version: '3.8'

volumes:
  db_data:
  redis_data:


networks:
  hisabaty_network:
    name: hisa_network
    #bridge is the default network driver for docker (all containers are connected to the same network)
    driver: bridge

services:

   hisabaty_app:
    container_name: hisabaty_app
    build : ./Dockerfile                                             
    image: hisabaty_app
    env_file:
      - .env
    ports:
      - ${APP_PORT}:8080
    networks:
      - hisabaty_network
    restart: always

  database_hisabaty:
    container_name: hisabaty_db
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - hisabaty_network
    restart: always

  redis : 
    container_name: hisabaty_redis
    image: redis:latest
    ports:
      - ${REDIS_PORT}:6379
    networks:
      - hisabaty_network
    restart: always
    volumes:
      - redis_data:/data

    nginx: 
    image: nginx:latest
    container_name: hisabaty_nginx
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - hisabaty_network
    restart: always
    depends_on:
      - hisabaty_app



    
